<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Secret — secret.sa | Cybersecurity </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #e8eef5;
      --bg-panel: rgba(255, 255, 255, 0.94);
      --border-subtle: rgba(20, 45, 60, 0.1);
      --border-glow: rgba(0, 130, 100, 0.22);
      --accent: #008f6f;
      --accent-bright: #00b386;
      --accent-dim: #006b52;
      --danger: #c41e3a;
      --text: #14212e;
      --text-muted: #4a5d6e;
      --grid-line: rgba(0, 95, 75, 0.055);
      --shadow-sm: 0 1px 3px rgba(20, 45, 60, 0.06);
      --shadow-md: 0 10px 40px rgba(20, 45, 60, 0.09);
      --shadow-hover: 0 18px 48px rgba(20, 45, 60, 0.11);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      background-color: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    body[dir="ltr"] {
      font-family: "Alexandria", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 575.98px) {
      .bg-grid {
        background-size: 32px 32px;
      }
    }

    .bg-radial {
      position: fixed;
      width: 120vmax;
      height: 120vmax;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(0, 179, 134, 0.09) 0%, transparent 58%);
      pointer-events: none;
      z-index: 0;
    }

    .content-wrap {
      position: relative;
      z-index: 1;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .navbar-custom {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      background: rgba(255, 255, 255, 0.86) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .navbar-custom .container {
      --nav-x: clamp(0.75rem, 4vw, 1rem);
      padding-left: var(--nav-x);
      padding-right: var(--nav-x);
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .navbar-custom .navbar-brand:focus-visible,
    .navbar-custom #btnLang:focus-visible,
    .btn-action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .brand-mark {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      letter-spacing: -0.015em;
      font-weight: 700;
      font-size: clamp(1rem, 2.9vw, 1.15rem);
      color: var(--accent-dim) !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    body[dir="rtl"] .brand-mark {
      letter-spacing: 0;
    }

    .brand-domain {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      font-size: clamp(0.65rem, 2vw, 0.72rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted) !important;
      opacity: 0.9;
      text-shadow: none;
      margin-top: 0.15rem;
    }

    .brand-domain:hover {
      color: var(--accent) !important;
      opacity: 1;
    }

    .lang-toggle__label {
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .lang-toggle .btn {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      font-size: clamp(0.8rem, 2.8vw, 0.9rem);
      font-weight: 600;
      padding: 0.5rem 0.85rem;
      min-height: 2.75rem;
      min-width: 2.75rem;
      border-color: rgba(0, 111, 88, 0.28);
      color: var(--accent-dim);
      background: rgba(255, 255, 255, 0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .lang-toggle .btn:hover {
      background: rgba(0, 143, 111, 0.1);
      border-color: var(--accent);
      color: var(--text);
    }

    .lang-toggle .btn:active {
      transform: scale(0.98);
    }

    .hero {
      padding-top: clamp(2.25rem, 6vw + 1rem, 4.5rem);
      padding-bottom: clamp(1.75rem, 4vw, 3rem);
      padding-inline: clamp(0.5rem, 3vw, 0.75rem);
    }

    .logo-shield {
      width: clamp(72px, 18vw, 92px);
      height: clamp(72px, 18vw, 92px);
      margin: 0 auto clamp(1rem, 3vw, 1.5rem);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-shield::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 22px;
      background: radial-gradient(circle at 40% 35%, rgba(0, 179, 134, 0.2), transparent 55%),
        linear-gradient(135deg, rgba(184, 150, 89, 0.14), transparent 50%, rgba(0, 111, 88, 0.08));
      opacity: 0.85;
      filter: blur(10px);
      z-index: 0;
      pointer-events: none;
    }

    .logo-shield-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      background: linear-gradient(168deg, rgba(255, 255, 255, 0.98), rgba(248, 252, 250, 0.95));
      border: 1px solid rgba(184, 150, 89, 0.38);
      border-radius: clamp(14px, 3vw, 18px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.65rem, 5.5vw, 2.1rem);
      color: var(--accent);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.92),
        inset 0 1px 0 rgba(255, 255, 255, 1),
        0 0 0 2px rgba(255, 255, 255, 0.65),
        0 0 0 3px rgba(0, 111, 88, 0.12),
        var(--shadow-md);
    }

    .tagline {
      font-weight: 600;
      font-size: clamp(1.1rem, 4.2vw + 0.35rem, 2rem);
      line-height: 1.42;
      max-width: min(42rem, 100%);
      margin-left: auto;
      margin-right: auto;
      text-wrap: balance;
      padding-inline: 0.125rem;
      background: linear-gradient(120deg, #0a1620 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body[dir="ltr"] .tagline {
      letter-spacing: -0.02em;
    }

    .tagline-accent {
      background: linear-gradient(120deg, var(--accent-bright) 0%, var(--accent) 45%, var(--accent-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub-tag {
      color: var(--text-muted);
      font-size: clamp(0.875rem, 2.4vw + 0.2rem, 1rem);
      line-height: 1.6;
      max-width: min(40rem, 100%);
      margin: clamp(0.75rem, 2vw, 1rem) auto 0;
      text-wrap: pretty;
      padding-inline: 0.25rem;
    }

    .mono-pill {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(0.58rem, 1.8vw + 0.25rem, 0.72rem);
      color: var(--accent-dim);
      border: 1px solid rgba(0, 111, 88, 0.22);
      background: rgba(0, 143, 111, 0.06);
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      display: inline-block;
      margin-top: clamp(0.85rem, 2.5vw, 1.25rem);
      letter-spacing: 0.06em;
      line-height: 1.45;
      max-width: 100%;
      text-align: center;
      word-break: break-word;
      hyphens: auto;
    }

    .service-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: clamp(12px, 2.5vw, 16px);
      padding: clamp(1.25rem, 4.5vw, 2rem);
      height: 100%;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: var(--shadow-sm);
    }

    .service-card .fw-semibold {
      color: var(--text);
    }

    @media (hover: hover) and (pointer: fine) {
      .service-card:hover {
        border-color: rgba(0, 111, 88, 0.28);
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
      }

      .service-card.secret:hover {
        border-color: rgba(0, 111, 88, 0.28);
        box-shadow: var(--shadow-hover);
      }
    }

    .service-card.secret {
      border-color: var(--border-subtle);
    }

    /* بطاقة الرسالة السرية — ظرف خفيف ضمن هوية الصفحة */
    .service-card--letter {
      position: relative;
      overflow: hidden;
      padding-top: clamp(2.35rem, 6.5vw, 3.1rem);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(244, 249, 247, 0.96) 45%, rgba(255, 255, 255, 0.96) 100%);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    .service-card--letter::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: clamp(2.1rem, 6vw, 2.85rem);
      margin: 0 auto;
      background: linear-gradient(180deg, #e8f2ef 0%, #dceae6 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-bottom: 1px solid rgba(0, 111, 88, 0.1);
      pointer-events: none;
    }

    .service-card--letter::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: clamp(1.85rem, 5vw, 2.5rem);
      left: 8%;
      right: 8%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 111, 88, 0.1) 25%, rgba(0, 111, 88, 0.1) 75%, transparent);
      pointer-events: none;
    }

    .service-card--letter > * {
      position: relative;
      z-index: 1;
    }

    .service-card__message-mark {
      width: clamp(3.25rem, 14vw, 4.25rem);
      height: clamp(3.25rem, 14vw, 4.25rem);
      margin: 0 auto 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-card__message-mark svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0, 111, 88, 0.1));
    }

    .modal {
      padding-top: max(1rem, env(safe-area-inset-top, 0px));
      padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
      padding-left: max(1rem, env(safe-area-inset-left, 0px));
      padding-right: max(1rem, env(safe-area-inset-right, 0px));
    }

    .service-icon {
      width: clamp(48px, 12vw, 52px);
      height: clamp(48px, 12vw, 52px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      margin-bottom: 1.25rem;
    }

    .service-card:not(.secret) .service-icon {
      background: rgba(0, 143, 111, 0.12);
      color: var(--accent-dim);
    }

    .btn-action {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      font-size: clamp(0.85rem, 2.2vw, 0.95rem);
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      min-height: 2.875rem;
      border-radius: 10px;
      letter-spacing: 0.01em;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-action:active {
      filter: brightness(0.95);
    }

    .btn-action-primary {
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      border: none;
      color: #fff;
      font-weight: 600;
    }

    .btn-action-primary:hover {
      filter: brightness(1.05);
      color: #fff;
    }

    .btn-action-outline {
      border: 1px solid rgba(0, 111, 88, 0.32);
      color: var(--accent-dim);
      background: rgba(255, 255, 255, 0.92);
    }

    .btn-action-outline:hover {
      background: rgba(0, 143, 111, 0.1);
      color: var(--text);
      border-color: var(--accent);
    }

    .modal-content.cyber-modal {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      color: var(--text);
      border-radius: clamp(12px, 3vw, 16px);
      max-height: calc(100dvh - 2rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-md);
    }

    .modal-fullscreen-sm-down .modal-content.cyber-modal {
      max-height: none;
      border-radius: 0;
      min-height: 100dvh;
      box-shadow: none;
    }

    .modal-header .btn-close {
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: 0.75rem;
      opacity: 0.85;
    }

    .modal-header .btn-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: none;
    }

    .modal-body {
      padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
    }

    .modal-footer {
      border-top-color: var(--border-subtle);
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
    }

    .modal-footer .btn {
      min-height: 2.75rem;
      padding-left: 1.25rem;
      padding-right: 1.25rem;
    }

    .modal-content.cyber-modal.danger-border {
      border-color: rgba(196, 30, 58, 0.35);
    }

    .modal-header {
      border-bottom-color: var(--border-subtle);
    }

    .footer-mini {
      color: var(--text-muted);
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      line-height: 1.55;
      padding: clamp(1.5rem, 4vw, 2rem) clamp(0.75rem, 4vw, 1rem) max(1.25rem, env(safe-area-inset-bottom, 0px));
      text-wrap: balance;
    }

    .scan-line {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 143, 111, 0.12), transparent);
      animation: scan 8s linear infinite;
      pointer-events: none;
      z-index: 2;
      opacity: 0.65;
    }

    @keyframes scan {
      0% { top: 0; opacity: 0; }
      5% { opacity: 0.6; }
      95% { opacity: 0.6; }
      100% { top: 100%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan-line {
        animation: none;
        opacity: 0;
      }

      .service-card {
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .lang-toggle .btn:active {
        transform: none;
      }
    }

    @media (min-width: 1200px) {
      .page-main .row {
        --bs-gutter-x: 2rem;
      }
    }

    .contact-strip {
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
      margin-top: 0.25rem;
      padding-top: clamp(1.25rem, 3.5vw, 1.85rem);
      border-top: 1px solid var(--border-subtle);
    }

    .contact-mail {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-weight: 600;
      color: var(--accent-dim);
      text-decoration: none;
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
    }

    .contact-mail:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .contact-mail:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .contact-mail .bi {
      font-size: 1.15rem;
      opacity: 0.88;
    }

    .modal-contact {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
    }

    .bg-page-audio {
      position: fixed;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
      left: -100px;
      top: 0;
    }

    .bg-audio-ui {
      position: fixed;
      z-index: 1080;
      bottom: max(0.65rem, env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      max-width: min(94vw, 24rem);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .bg-audio-btn {
      font-family: inherit;
      font-size: clamp(0.72rem, 2.5vw, 0.82rem);
      font-weight: 600;
      padding: 0.35rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(0, 143, 111, 0.35);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(240, 248, 245, 0.96));
      color: var(--accent-dim);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .bg-audio-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .bg-audio-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <audio
    id="bgPageAudio"
    class="bg-page-audio"
    loop
    playsinline
    preload="auto"
    muted
    aria-hidden="true"
  >
    <source src="bg-music.m4a" type="audio/mp4" />
    <source src="bg-music.mp3" type="audio/mpeg" />
  </audio>
  <div id="bgAudioUi" class="bg-audio-ui" role="region" aria-label="Background audio">
    <button type="button" class="bg-audio-btn" id="bgAudioPlayBtn" data-i18n="bg_audio_btn">تشغيل الصوت</button>
  </div>

  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-radial" aria-hidden="true"></div>
  <div class="scan-line" aria-hidden="true"></div>

  <div class="content-wrap">
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom sticky-top">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand brand-mark d-inline-flex flex-column align-items-start text-decoration-none" href="https://secret.sa" rel="noopener">
          <span data-i18n="brand">Secret</span>
          <span class="brand-domain">secret.sa</span>
        </a>
        <div class="lang-toggle d-flex gap-2 align-items-center">
          <span class="text-secondary small d-none d-sm-inline lang-toggle__label" data-i18n="lang_label">اللغة</span>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="btnLang" aria-label="Toggle language">EN / عربي</button>
        </div>
      </div>
    </nav>

    <header class="hero text-center container">
      <div class="logo-shield" role="img" aria-label="شعار Secret — درع أمني بقفل">
        <div class="logo-shield-inner" aria-hidden="true">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
      </div>
      <h1 class="tagline mb-0">
        <span data-i18n="tagline_prefix"></span>
        <span class="tagline-accent" data-i18n="tagline_highlight"></span>
        <span data-i18n="tagline_suffix"></span>
      </h1>
      <p class="sub-tag" data-i18n="subtag"></p>
      <span class="mono-pill" data-i18n="pill"></span>
    </header>

    <main class="container pb-4 pb-md-5 page-main">
      <div class="row g-3 g-md-4 justify-content-center align-items-stretch">
        <div class="col-md-6 col-lg-5 d-flex">
          <article class="service-card h-100 w-100 d-flex flex-column">
            <div class="service-icon">
              <i class="bi bi-bug-fill"></i>
            </div>
            <h2 class="fw-semibold mb-2 fs-6 fs-md-5" data-i18n="card_services_title"></h2>
            <p class="text-secondary flex-grow-1 mb-4 fs-6" data-i18n="card_services_desc"></p>
            <button type="button" class="btn btn-action btn-action-primary w-100 mt-auto" data-bs-toggle="modal" data-bs-target="#modalServices" data-i18n="card_services_btn"></button>
          </article>
        </div>
        <div class="col-md-6 col-lg-5 d-flex">
          <article class="service-card secret service-card--letter h-100 w-100 d-flex flex-column">
            <div class="service-card__message-mark" aria-hidden="true">
              <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="envPaper" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#ecf6f3" />
                  </linearGradient>
                  <linearGradient id="envFlapFill" x1="0" y1="0" x2="0" y2="1">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const STRINGS = {
      ar: {
        brand: "Secret",
        lang_label: "اللغة",
        tagline_prefix: "",
        tagline_highlight: "اكتشف الثغرات الأمنية لديك",
        tagline_suffix: " قبل أن يكتشفها الهاكر.",
        subtag: "فريق سعودي في الأمن السيبراني—اختبار اختراق وتقييم ثغرات أمنية بتقارير احترافية، بسرية تامة وبموجب اتفاقية عدم الإفصاح (NDA).",
        pill: "CONFIDENTIAL // NDA // PENTEST // VULN ASSESS",
        card_secret_title: "خدمة الرسالة السرية",
        card_secret_desc: "قناة مشفّرة للتواصل الحساس. الوصول مقيّد بصلاحيات صريحة ومزدوجة التحقق.",
        card_secret_btn: "دخول الخدمة",
        card_services_title: "خدمة اختبار الاختراق وتقييم الثغرات",
        card_services_desc: "اختبار اختراق يحاكي أساليب المهاجمين، وتقييم منهجي للثغرات مع تقرير تفصيلي وتوصيات، ثم إعادة اختبار بعد المعالجة—بسرية واتفاقية عدم الإفصاح (NDA).",
        card_services_btn: "عرض التفاصيل",
        modal_unauth_title: "غير مخوّل",
        modal_unauth_body: "أنت غير مخوّل للوصول إلى خدمة الرسالة السرية.",
        modal_services_title: "خدمة اختبار الاختراق وتقييم الثغرات",
        modal_services_body:
          "نقدم خدمات اختبار الاختراق وتقييم الثغرات الأمنية باحترافية عالية، من خلال فريق سعودي متخصص في الأمن السيبراني، مع تقارير تفصيلية تتضمن التوصيات الأمنية وآليات المعالجة، وذلك بسرية تامة ووفق اتفاقية عدم الإفصاح (NDA).",
        modal_close: "إغلاق",
        footer: "© Secret - secret.sa",
        contact_label: "للتواصل معنا بخصوص الخدمات:",
        logo_aria: "شعار Secret — درع أمني بقفل",
        bg_audio_btn: "تشغيل الصوت",
      },
      en: {
        brand: "Secret",
        lang_label: "Language",
        tagline_prefix: "",
        tagline_highlight: "Discover your security vulnerabilities",
        tagline_suffix: " before the hacker does.",
        subtag: "Saudi cybersecurity team—penetration testing, vulnerability assessment, and detailed reporting under strict confidentiality and NDA.",
        pill: "CONFIDENTIAL // NDA // PENTEST // VULN ASSESS",
        card_secret_title: "Secret message service",
        card_secret_desc: "Encrypted channel for sensitive communications. Access requires explicit authorization and strong verification.",
        card_secret_btn: "Enter service",
        card_services_title: "Penetration testing and vulnerability assessment service",
        card_services_desc: "Adversary-style penetration testing, systematic vulnerability assessment, a detailed report with remediation guidance, and retesting after fixes—under strict confidentiality and NDA.",
        card_services_btn: "View details",
        modal_unauth_title: "Not authorized",
        modal_unauth_body: "You are not authorized to access the secret message service.",
        modal_services_title: "Penetration testing and vulnerability assessment service",
        modal_services_body:
          "We deliver penetration testing and security vulnerability assessment at the highest professional standard, through a Saudi team specialized in cybersecurity, with detailed reports that include security recommendations and remediation guidance—all under strict confidentiality and a non-disclosure agreement (NDA).",
        modal_close: "Close",
        footer: "© Secret - secret.sa",
        contact_label: "For service inquiries:",
        logo_aria: "Secret emblem — security shield with lock",
        bg_audio_btn: "Play sound",
      },
    };

    let currentLang = "ar";

    function applyLang(lang) {
      currentLang = lang;
      const root = document.documentElement;
      root.lang = lang;
      root.dir = lang === "ar" ? "rtl" : "ltr";
      document.getElementById("btnLang").textContent = lang === "ar" ? "English" : "العربية";

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (STRINGS[lang][key] !== undefined) {
          el.textContent = STRINGS[lang][key];
        }
      });

      const logoShield = document.querySelector(".logo-shield");
      if (logoShield && STRINGS[lang].logo_aria) {
        logoShield.setAttribute("aria-label", STRINGS[lang].logo_aria);
      }
    }

    document.getElementById("btnLang").addEventListener("click", () => {
      applyLang(currentLang === "ar" ? "en" : "ar");
    });

    applyLang("ar");

    (function () {
      const audio = document.getElementById("bgPageAudio");
      const ui = document.getElementById("bgAudioUi");
      const playBtn = document.getElementById("bgAudioPlayBtn");
      if (!audio) return;

      let unmuteApplied = false;

      function hideUi() {
        if (!ui) return;
        ui.style.opacity = "0";
        ui.style.transform = "translateX(-50%) translateY(10px)";
        setTimeout(function () {
          ui.remove();
        }, 380);
      }

      function removeGestureListeners() {
        document.removeEventListener("pointerdown", onUserInteract, true);
        document.removeEventListener("keydown", onUserInteract, true);
        if (playBtn) playBtn.removeEventListener("click", onPlayClick);
      }

      function tryAutoplayMuted() {
        audio.muted = true;
        audio.volume = 1;
        var p = audio.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {});
        }
      }

      function applyUnmute() {
        if (unmuteApplied) return;
        unmuteApplied = true;
        audio.muted = false;
        audio.volume = 1;
        var p = audio.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {});
        }
        hideUi();
        removeGestureListeners();
      }

      function onUserInteract() {
        if (unmuteApplied) return;
        applyUnmute();
      }

      function onPlayClick(e) {
        e.preventDefault();
        e.stopPropagation();
        onUserInteract();
      }

      document.addEventListener("pointerdown", onUserInteract, true);
      document.addEventListener("keydown", onUserInteract, true);
      if (playBtn) playBtn.addEventListener("click", onPlayClick);

      tryAutoplayMuted();
      audio.addEventListener("canplay", tryAutoplayMuted, { once: true });

      audio.addEventListener("error", function () {
        hideUi();
        removeGestureListeners();
      });
    })();
  </script>
