  <style>
    :root {
      --bg-deep: #e8eef5;
      --bg-panel: rgba(255, 255, 255, 0.94);
      --border-subtle: rgba(20, 45, 60, 0.1);
      --border-glow: rgba(0, 130, 100, 0.22);
      --accent: #008f6f;
      --accent-bright: #00b386;
      --accent-dim: #006b52;
      --danger: #c41e3a;
      --text: #14212e;
      --text-muted: #4a5d6e;
      --grid-line: rgba(0, 95, 75, 0.055);
      --shadow-sm: 0 1px 3px rgba(20, 45, 60, 0.06);
      --shadow-md: 0 10px 40px rgba(20, 45, 60, 0.09);
      --shadow-hover: 0 18px 48px rgba(20, 45, 60, 0.11);
      /* Navbar: نفس اتجاه/عائلة لون تدرّج «اكتشف» مع تمّ عميق للخلفية */
      --navbar-bg-gradient: linear-gradient(
        120deg,
        color-mix(in srgb, var(--accent-bright) 38%, #061511) 0%,
        color-mix(in srgb, var(--accent) 42%, #051410) 45%,
        color-mix(in srgb, var(--accent-dim) 46%, #04120f) 100%
      );
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      background-color: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1;
    }

    body[dir="ltr"] {
      font-family: "Alexandria", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 575.98px) {
      .bg-grid {
        background-size: 32px 32px;
      }
    }

    .bg-radial {
      position: fixed;
      width: 120vmax;
      height: 120vmax;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(0, 179, 134, 0.09) 0%, transparent 58%);
      pointer-events: none;
      z-index: 0;
    }

    .content-wrap {
      position: relative;
      z-index: 1;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .navbar-custom {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      background: var(--navbar-bg-gradient) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 179, 134, 0.22);
      box-shadow:
        0 1px 0 rgba(0, 211, 163, 0.12),
        0 12px 40px rgba(5, 42, 34, 0.42);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .navbar-custom .container {
      --nav-x: clamp(0.75rem, 4vw, 1rem);
      padding-left: var(--nav-x);
      padding-right: var(--nav-x);
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .navbar-custom .navbar-brand:focus-visible,
    .navbar-custom #btnLang:focus-visible,
    .btn-action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .navbar-custom .brand-mark {
      letter-spacing: -0.015em;
      font-weight: 700;
      font-size: clamp(1rem, 2.9vw, 1.15rem);
      color: #eef6f3 !important;
      text-shadow: 0 1px 14px rgba(0, 179, 134, 0.28);
    }

    .navbar-custom .brand-mark > span:first-of-type {
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.045em;
    }

    body[dir="ltr"] .navbar-custom .brand-mark > span:first-of-type {
      letter-spacing: -0.052em;
    }

    .navbar-custom .brand-domain {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      font-size: clamp(0.65rem, 2vw, 0.72rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      color: rgba(206, 222, 216, 0.82) !important;
      opacity: 1;
      text-shadow: none;
      margin-top: 0.15rem;
    }

    .navbar-custom .brand-domain:hover {
      color: var(--accent-bright) !important;
      opacity: 1;
    }

    .navbar-custom .lang-toggle__label {
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(210, 224, 218, 0.78);
    }

    .navbar-custom .lang-toggle .btn {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      font-size: clamp(0.8rem, 2.8vw, 0.9rem);
      font-weight: 600;
      padding: 0.5rem 0.85rem;
      min-height: 2.75rem;
      min-width: 2.75rem;
      border-color: rgba(0, 179, 134, 0.42);
      color: rgba(236, 248, 244, 0.96);
      background: rgba(255, 255, 255, 0.06);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .navbar-custom .lang-toggle .btn:hover {
      background: rgba(0, 179, 134, 0.14);
      border-color: var(--accent-bright);
      color: #f8fcfa;
    }

    .navbar-custom .lang-toggle .btn:active {
      transform: scale(0.98);
    }

    .hero {
      padding-top: clamp(2.25rem, 6vw + 1rem, 4.5rem);
      padding-bottom: clamp(1.75rem, 4vw, 3rem);
      padding-inline: clamp(0.5rem, 3vw, 0.75rem);
    }

    .brand-emblem {
      --emblem-w: clamp(93px, 22vw, 126px);
      width: var(--emblem-w);
      height: var(--emblem-w);
      margin: 0 auto clamp(1rem, 3vw, 1.45rem);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-emblem__halo {
      position: absolute;
      inset: -14%;
      border-radius: 26%;
      background:
        radial-gradient(ellipse at 38% 32%, rgba(0, 179, 134, 0.18), transparent 48%),
        radial-gradient(ellipse at 72% 72%, rgba(184, 150, 89, 0.1), transparent 52%);
      filter: blur(14px);
      opacity: 0.88;
      z-index: 0;
      pointer-events: none;
    }

    .brand-emblem__plate {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      filter:
        drop-shadow(0 1px 2px rgba(20, 45, 60, 0.06))
        drop-shadow(0 8px 20px rgba(20, 45, 60, 0.09));
    }

    .brand-emblem__plate svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (prefers-reduced-motion: no-preference) {
      .brand-emblem__plate {
        transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
      }

      .brand-emblem:hover .brand-emblem__plate {
        transform: translateY(-2px) scale(1.02);
        filter:
          drop-shadow(0 4px 8px rgba(0, 111, 88, 0.08))
          drop-shadow(0 18px 36px rgba(20, 45, 60, 0.12));
      }
    }

    .tagline {
      font-weight: 600;
      font-size: clamp(1.1rem, 4.2vw + 0.35rem, 2rem);
      line-height: 1.42;
      max-width: min(42rem, 100%);
      margin-left: auto;
      margin-right: auto;
      text-wrap: balance;
      padding-inline: 0.125rem;
      background: linear-gradient(120deg, #0a1620 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body[dir="ltr"] .tagline {
      letter-spacing: -0.02em;
    }

    .tagline-accent {
      background: linear-gradient(120deg, var(--accent-bright) 0%, var(--accent) 45%, var(--accent-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub-tag {
      color: var(--text-muted);
      font-size: clamp(0.875rem, 2.4vw + 0.2rem, 1rem);
      line-height: 1.6;
      max-width: min(40rem, 100%);
      margin: clamp(0.75rem, 2vw, 1rem) auto 0;
      text-wrap: pretty;
      padding-inline: 0.25rem;
    }

    .mono-pill {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(0.58rem, 1.8vw + 0.25rem, 0.72rem);
      color: var(--accent-dim);
      border: 1px solid rgba(0, 111, 88, 0.22);
      background: rgba(0, 143, 111, 0.06);
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      display: inline-block;
      margin-top: clamp(0.85rem, 2.5vw, 1.25rem);
      letter-spacing: 0.06em;
      line-height: 1.45;
      max-width: 100%;
      text-align: center;
      word-break: break-word;
      hyphens: auto;
    }

    .service-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: clamp(12px, 2.5vw, 16px);
      padding: clamp(1.25rem, 4.5vw, 2rem);
      height: 100%;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: var(--shadow-sm);
    }

    .service-card .fw-semibold {
      color: var(--text);
    }

    @media (hover: hover) and (pointer: fine) {
      .service-card:hover {
        border-color: rgba(0, 111, 88, 0.28);
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
      }

      .service-card.secret:hover {
        border-color: rgba(0, 111, 88, 0.28);
        box-shadow: var(--shadow-hover);
      }
    }

    .service-card.secret {
      border-color: var(--border-subtle);
    }

    /* بطاقة الرسالة السرية — ظرف خفيف ضمن هوية الصفحة */
    .service-card--letter {
      position: relative;
      overflow: hidden;
      padding-top: clamp(2.35rem, 6.5vw, 3.1rem);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(244, 249, 247, 0.96) 45%, rgba(255, 255, 255, 0.96) 100%);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    .service-card--letter::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: clamp(2.1rem, 6vw, 2.85rem);
      margin: 0 auto;
      background: linear-gradient(180deg, #e8f2ef 0%, #dceae6 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-bottom: 1px solid rgba(0, 111, 88, 0.1);
      pointer-events: none;
    }

    .service-card--letter::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: clamp(1.85rem, 5vw, 2.5rem);
      left: 8%;
      right: 8%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 111, 88, 0.1) 25%, rgba(0, 111, 88, 0.1) 75%, transparent);
      pointer-events: none;
    }

    .service-card--letter > * {
      position: relative;
      z-index: 1;
    }

    .service-card__message-mark {
      width: clamp(3.25rem, 14vw, 4.25rem);
      height: clamp(3.25rem, 14vw, 4.25rem);
      margin: 0 auto 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-card__message-mark svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0, 111, 88, 0.1));
    }

    .modal {
      padding-top: max(1rem, env(safe-area-inset-top, 0px));
      padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
      padding-left: max(1rem, env(safe-area-inset-left, 0px));
      padding-right: max(1rem, env(safe-area-inset-right, 0px));
    }

    .service-icon {
      width: clamp(48px, 12vw, 52px);
      height: clamp(48px, 12vw, 52px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      margin-bottom: 1.25rem;
    }

    .service-card:not(.secret) .service-icon {
      background: rgba(0, 143, 111, 0.12);
      color: var(--accent-dim);
    }

    .btn-action {
      font-family: "Alexandria", "Segoe UI", "Tahoma", sans-serif;
      font-size: clamp(0.85rem, 2.2vw, 0.95rem);
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      min-height: 2.875rem;
      border-radius: 10px;
      letter-spacing: 0.01em;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-action:active {
      filter: brightness(0.95);
    }

    .btn-action-primary {
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      border: none;
      color: #fff;
      font-weight: 600;
    }

    .btn-action-primary:hover {
      filter: brightness(1.05);
      color: #fff;
    }

    .btn-action-outline {
      border: 1px solid rgba(0, 111, 88, 0.32);
      color: var(--accent-dim);
      background: rgba(255, 255, 255, 0.92);
    }

    .btn-action-outline:hover {
      background: rgba(0, 143, 111, 0.1);
      color: var(--text);
      border-color: var(--accent);
    }

    .modal-content.cyber-modal {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      color: var(--text);
      border-radius: clamp(12px, 3vw, 16px);
      max-height: calc(100dvh - 2rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-md);
    }

    .modal-fullscreen-sm-down .modal-content.cyber-modal {
      max-height: none;
      border-radius: 0;
      min-height: 100dvh;
      box-shadow: none;
    }

    .modal-header .btn-close {
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: 0.75rem;
      opacity: 0.85;
    }

    .modal-header .btn-close:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: none;
    }

    .modal-body {
      padding-bottom: max(1rem, env(safe-area-inset-bottom, 0px));
    }

    .modal-footer {
      border-top-color: var(--border-subtle);
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
    }

    .modal-footer .btn {
      min-height: 2.75rem;
      padding-left: 1.25rem;
      padding-right: 1.25rem;
    }

    .modal-content.cyber-modal.danger-border {
      border-color: rgba(196, 30, 58, 0.35);
    }

    .modal-header {
      border-bottom-color: var(--border-subtle);
    }

    .footer-mini {
      color: var(--text-muted);
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      line-height: 1.55;
      padding: clamp(1.5rem, 4vw, 2rem) clamp(0.75rem, 4vw, 1rem) max(1.25rem, env(safe-area-inset-bottom, 0px));
      text-wrap: balance;
    }

    .scan-line {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 143, 111, 0.12), transparent);
      animation: scan 8s linear infinite;
      pointer-events: none;
      z-index: 2;
      opacity: 0.65;
    }

    @keyframes scan {
      0% { top: 0; opacity: 0; }
      5% { opacity: 0.6; }
      95% { opacity: 0.6; }
      100% { top: 100%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan-line {
        animation: none;
        opacity: 0;
      }

      .service-card {
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .navbar-custom .lang-toggle .btn:active {
        transform: none;
      }
    }

    @media (min-width: 1200px) {
      .page-main .row {
        --bs-gutter-x: 2rem;
      }
    }

    .contact-strip {
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
      margin-top: 0.25rem;
      padding-top: clamp(1.25rem, 3.5vw, 1.85rem);
      border-top: 1px solid var(--border-subtle);
    }

    .contact-mail {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-weight: 600;
      color: var(--accent-dim);
      text-decoration: none;
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
    }

    .contact-mail:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .contact-mail:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .contact-mail .bi {
      font-size: 1.15rem;
      opacity: 0.88;
    }

    .modal-contact {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-subtle);
    }

    .bg-page-audio {
      position: fixed;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
      left: -100px;
      top: 0;
    }

    .bg-audio-ui {
      position: fixed;
      z-index: 1080;
      bottom: max(0.65rem, env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;

    let currentLang = "ar";

      currentLang = lang;

      root.lang = lang === "ar" ? "ar-SA" : "en-US";
      root.dir = lang === "ar" ? "rtl" : "ltr";
      document.getElementById("btnLang").textContent = lang === "ar" ? "English" : "العربية";

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (STRINGS[lang][key] !== undefined) {
          el.textContent = STRINGS[lang][key];
        }
      });

        brandEmblem.setAttribute("aria-label", STRINGS[lang].logo_aria);
      }

      if (STRINGS[lang].seo_title) {
        document.title = STRINGS[lang].seo_title;
      }
      const metaDesc = document.getElementById("metaDescription");
      if (metaDesc && STRINGS[lang].seo_description) {
        metaDesc.setAttribute("content", STRINGS[lang].seo_description);

      const ogTitleEl = document.getElementById("ogTitle");
      const ogDescEl = document.getElementById("ogDescription");

      const twDescEl = document.getElementById("twitterDescription");

      }
    }

    document.getElementById("btnLang").addEventListener("click", () => {
      applyLang(currentLang === "ar" ? "en" : "ar");
    });

    applyLang("ar");

    (function () {
      const audio = document.getElementById("bgPageAudio");
      const ui = document.getElementById("bgAudioUi");
      const playBtn = document.getElementById("bgAudioPlayBtn");
      if (!audio) return;

      let unmuteApplied = false;

      function hideUi() {
        if (!ui) return;
        ui.style.opacity = "0";
        ui.style.transform = "translateX(-50%) translateY(10px)";
        setTimeout(function () {
          ui.remove();
        }, 380);
      }

      function removeGestureListeners() {
        document.removeEventListener("pointerdown", onUserInteract, true);
        document.removeEventListener("keydown", onUserInteract, true);
        if (playBtn) playBtn.removeEventListener("click", onPlayClick);
      }

      function tryAutoplayMuted() {
        audio.muted = true;
        audio.volume = 1;
        var p = audio.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {});
        }
      }

      function applyUnmute() {
        if (unmuteApplied) return;
        unmuteApplied = true;
        audio.muted = false;
        audio.volume = 1;
        var p = audio.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {});
        }
        hideUi();
        removeGestureListeners();
      }

      function onUserInteract() {
        if (unmuteApplied) return;
        applyUnmute();
      }

      function onPlayClick(e) {
        e.preventDefault();
        e.stopPropagation();
        onUserInteract();
      }

      document.addEventListener("pointerdown", onUserInteract, true);
      document.addEventListener("keydown", onUserInteract, true);
      if (playBtn) playBtn.addEventListener("click", onPlayClick);

      tryAutoplayMuted();
      audio.addEventListener("canplay", tryAutoplayMuted, { once: true });

      audio.addEventListener("error", function () {
        hideUi();
        removeGestureListeners();
      });
    })();
